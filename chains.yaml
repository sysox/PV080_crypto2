# chains.yaml — chain-instance records (stage-tagged nodes citing facts)
#
# STATUS: 13 chains. First 10 fully validated (two review rounds each - see git log for the
# issues found and fixed). 3 more added in one pass (hybrid-encryption, cbc-predictable-iv,
# timing-side-channel) plus enrichments to 4 existing chains (block-cipher-iteration,
# ecb-pattern-leakage, composition-integrity, otp-tradeoff), targeting facts that were core-
# importance but cited by zero chains - fact coverage went from 39/75 to 62/75. Not yet through a
# second external review round; treat the newest 3 chains as one step behind the other 10 until
# that happens. Two chains (replay-freshness, public-key-binding) are honestly thinner than the
# rest: both lean on one fact (F52, F13 respectively) across most of their nodes because the fact
# base doesn't yet have deeper content there (freshness mechanisms, certificates/PKI are
# explicitly future-file territory) - kept as-is with that limitation noted inline rather than
# padded out artificially. cbc-predictable-iv's threat_ref is a similarly honest imperfect fit:
# the attack needs a chosen-plaintext-style capability neither T1 nor T2 cleanly describes -
# flagged inline rather than forcing a fit or inventing a third threat profile prematurely.
# Decision background: fact-granularity-dilemma.md (three-layer model: facts -> chain-instance
# nodes -> takeaways; stage lives on the node, not the fact).
#
# Schema:
#   id / title        - a named chain instance
#   usecase_ref        - id from usecases-ciphers.md (stage 1 of logical-chain.md); the chain's
#                          default use case
#   threat_ref          - id from usecases-ciphers.md (stage 2); the chain's default threat -
#                          kept out of `nodes` deliberately, same reasoning as activity-model.md's
#                          practical-examples-stay-separate rule
#   nodes:
#     id                - stable within this chain
#     stage             - one of logical-chain.md's remaining 6 stages (security_goal, requirement,
#                          mechanism, implementation_requirement, failure, attack)
#     claim             - one-line human paraphrase of what this node asserts (not copied from the
#                          fact verbatim - the fact is the source of truth, this is a chain-specific
#                          gloss on it)
#     fact_refs         - facts supporting this node; "F9:slug" form cites a sub-claim within a
#                          bundled fact without splitting it (see fact-granularity-dilemma.md)
#     leads_to          - ids of node(s) this one motivates; a list to allow branching (one
#                          implementation requirement can fail in more than one way)
#     usecase_ref        - OPTIONAL, node-level override of the chain's default usecase_ref, for a
#                          node where the relevant use case genuinely shifts partway through a chain
#                          (e.g. a failure mode specific to a deployment shape the earlier nodes
#                          didn't assume)
#     threat_ref          - OPTIONAL, node-level override of the chain's default threat_ref, for a
#                          branch that genuinely needs a different adversary capability than the
#                          rest of the chain (e.g. one branch needs only passive observation, a
#                          sibling branch needs active chosen-ciphertext-style interaction)

chains:
  - id: nonce-reuse
    title: Stream-cipher / CTR keystream reuse breaks confidentiality
    usecase_ref: U2   # repeated communication under a shared key (U5 also relevant - see failure_multi_instance)
    threat_ref: T1    # passive eavesdropper is sufficient for the base attack; no active adversary needed

    nodes:
      - id: goal
        stage: security_goal
        claim: The scheme must provide confidentiality.
        fact_refs: [F2]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: The keystream must never repeat under the same key. (This chain isolates the
          uniqueness-specific failure mode; it assumes the keystream generator itself is properly
          pseudorandom, F25 - a weak generator like RC4, F63, is a different chain, not this one.)
        fact_refs: [F24, F25]
        leads_to: [mechanism]

      - id: mechanism
        stage: mechanism
        claim: A stream cipher (or a CTR-mode block cipher, structurally the same shape) combines
          plaintext with a keystream via XOR, one unit at a time.
        fact_refs: [F23]
        leads_to: [impl_requirement]

      - id: impl_requirement
        stage: implementation_requirement
        claim: One way to satisfy the uniqueness requirement in practice is a persistent,
          monotonically incrementing counter (F64). The three failure nodes below are specific to
          this counter-based choice. (The alternative - an independently and uniformly sampled
          random nonce, also F64 - has a different failure profile entirely, the birthday-bound
          collision tradeoff in F69/F70, not modeled in this chain instance.)
        fact_refs: [F64]
        leads_to: [failure_restart, failure_multi_instance, failure_wraparound]

      - id: failure_restart
        stage: failure
        claim: A counter-based nonce that resets to zero on process restart, without persisting its
          last value, silently reuses nonces already used before the crash.
        fact_refs: [F66]
        leads_to: [attack]

      - id: failure_multi_instance
        stage: failure
        usecase_ref: U5   # overrides the chain's default U2 - horizontally-scaled shared-key
                           # deployment is the use case this specific failure mode actually needs
        claim: Multiple instances sharing one key (replicas, forked processes, cloned snapshots),
          each independently counting from the same starting state, reproduce the exact same nonce
          sequence across instances.
        fact_refs: [F67]
        leads_to: [attack]

      - id: failure_wraparound
        stage: failure
        claim: A counter-based nonce whose bit-width is exceeded wraps around and repeats a
          previously-used value within the lifetime of a single key.
        fact_refs: [F65]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: XORing the two resulting ciphertexts gives exactly the XOR of the two plaintexts -
          already a confidentiality violation regardless of what happens next; crib-dragging or
          frequency analysis can go further and fully recover both plaintexts given enough structure
          in the underlying data.
        fact_refs: [F26, F27]
        leads_to: []

  - id: ecb-pattern-leakage
    title: ECB mode leaks plaintext structure without breaking the cipher
    usecase_ref: U3   # data at rest under a long-lived key - the classic "encrypt this file/image" case
    threat_ref: T1    # passive eavesdropper; no tampering needed to see the leak

    nodes:
      - id: goal
        stage: security_goal
        claim: The scheme must provide confidentiality.
        fact_refs: [F2]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: Because a block cipher only defines a mapping for one block (F15), using it on a
          longer message requires deciding how to handle multiple blocks - and specifically,
          repeated or related plaintext blocks must not produce identical or trivially related
          ciphertext blocks.
        fact_refs: [F15, F35]
        leads_to: [mechanism]

      - id: mechanism
        stage: mechanism
        claim: Electronic Codebook (ECB) applies the block cipher independently to each block, with
          no chaining, randomization, or counter - it is itself a mode, just a degenerate one, not
          the absence of a mode.
        fact_refs: [F39]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: Because encryption under a fixed key is deterministic, identical plaintext blocks
          always produce identical ciphertext blocks - the chosen mechanism directly violates the
          requirement it was supposed to satisfy.
        fact_refs: [F39]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: An observer sees repeated ciphertext blocks and thereby learns the corresponding
          plaintext blocks are identical - structural information leaked without recovering the key
          or the plaintext content itself (the "ECB penguin" effect).
        fact_refs: [F40]
        leads_to: []

  - id: composition-integrity
    title: Adding integrity to encryption - AEAD or hand-composed, and not every hand-composed
      ordering is equally safe
    usecase_ref: U2   # repeated communication under a shared key
    threat_ref: T2    # active adversary - this chain only matters once tampering is in scope

    nodes:
      - id: goal
        stage: security_goal
        claim: The scheme must additionally provide integrity - confidentiality alone does not
          imply it.
        fact_refs: [F41]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: Detecting ciphertext tampering needs a separate mechanism using a secret, on top of
          whatever already provides confidentiality.
        fact_refs: [F43]
        leads_to: [mechanism_aead, mechanism_manual]

      - id: mechanism_aead
        stage: mechanism
        claim: Use a dedicated AEAD construction (e.g. GCM), which packages confidentiality and
          integrity into one integrated primitive with a well-defined failure behavior - the
          standard modern default, and safe without the caveats below.
        fact_refs: [F45]
        leads_to: []

      - id: mechanism_manual
        stage: mechanism
        claim: If no dedicated AEAD construction is used, combine encryption with a MAC by hand
          (generic composition) instead.
        fact_refs: [F46]
        leads_to: [impl_requirement]

      - id: impl_requirement
        stage: implementation_requirement
        claim: When composing by hand, the encryption key and MAC key must be independently
          derived - typically via a KDF, deriving both from one shared secret with different
          context/info strings rather than distributing two unrelated keys - and one of three
          orderings must be chosen - Encrypt-then-MAC, MAC-then-encrypt, or Encrypt-and-MAC. The
          three are not equally safe.
        fact_refs: [F46, F48, F68]
        leads_to: [failure_padding_oracle, failure_tag_leak, safe_etm]

      - id: failure_padding_oracle
        stage: failure
        claim: "MAC-then-encrypt must decrypt - and therefore validate the Padding a partial final
          block required in the first place (F16) - before the MAC can even be checked, so a
          distinguishable 'bad padding' vs. 'bad MAC' response becomes an observable oracle."
        fact_refs: [F16, F49]
        leads_to: [attack_padding_oracle]

      - id: attack_padding_oracle
        stage: attack
        claim: An attacker who can distinguish valid from invalid padding after decryption can
          recover a CBC-mode plaintext one byte at a time, without knowing the key.
        fact_refs: [F50]
        leads_to: []

      - id: failure_tag_leak
        stage: failure
        claim: A MAC is designed only for unforgeability, not confidentiality, so computing it
          directly over the plaintext (Encrypt-and-MAC) can leak information through the tag itself
          - e.g. a deterministic MAC reveals repeated plaintexts via a repeated tag, independent of
          the encryption half.
        fact_refs: [F47]
        leads_to: [attack_tag_leak]

      - id: attack_tag_leak
        stage: attack
        claim: An adversary can test whether two messages are equal by comparing their tags,
          without breaking the encryption or the MAC's own unforgeability at all.
        fact_refs: [F47]
        leads_to: []

      - id: safe_etm
        stage: mechanism
        claim: "Encrypt-then-MAC - encrypt first, then compute the MAC over the resulting
          ciphertext. Given independently-keyed schemes, verification-before-release, an
          unforgeable MAC, and the other stated assumptions, this ordering is generically robust:
          integrity can be checked without ever decrypting or trusting the encryption scheme's own
          robustness."
        fact_refs: [F51]
        leads_to: []

  - id: rsa-determinism
    title: Textbook RSA's determinism and malleability, and why padding fixes both
    usecase_ref: U1   # first contact, no pre-shared key - RSA's natural use case
    threat_ref: T1    # passive eavesdropper suffices for the equality-testing attack; the
                       # malleability attack additionally assumes some chosen-ciphertext access

    nodes:
      - id: goal
        stage: security_goal
        claim: The scheme must provide confidentiality.
        fact_refs: [F2]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: Meeting the bare infeasible-recovery floor is necessary but not sufficient for a
          full security guarantee - stronger notions need more.
        fact_refs: [F3]
        leads_to: [mechanism_textbook, mechanism_oaep]

      - id: mechanism_textbook
        stage: mechanism
        claim: "Textbook (unpadded) RSA: encrypt directly via modular exponentiation, no
          randomization added."
        fact_refs: ["F59:textbook"]
        leads_to: [failure_determinism, failure_homomorphism]

      - id: failure_determinism
        stage: failure
        claim: Encrypting the same plaintext twice always yields the same ciphertext.
        fact_refs: ["F59:determinism"]
        leads_to: [attack_equality]

      - id: attack_equality
        stage: attack
        claim: An adversary can test plaintext equality between candidate messages just by
          comparing ciphertexts, without knowing the key.
        fact_refs: ["F59:determinism"]
        leads_to: []

      - id: failure_homomorphism
        stage: failure
        threat_ref: T2   # overrides the chain's default T1 - transforming a ciphertext and getting
                          # it decrypted/processed needs an active capability, not just observation
        claim: "RSA's multiplicative structure means Enc(m1)*Enc(m2) = Enc(m1*m2) mod n."
        fact_refs: ["F59:homomorphism"]
        leads_to: [attack_malleability]

      - id: attack_malleability
        stage: attack
        threat_ref: T2
        claim: An adversary can transform a ciphertext into another, predictably related,
          ciphertext, and submit it for decryption/processing to exploit the relation - this needs
          an active capability, unlike the passive-observer equality test above.
        fact_refs: ["F59:homomorphism"]
        leads_to: []

      - id: mechanism_oaep
        stage: mechanism
        claim: Practical RSA encryption adds randomized padding (e.g. RSA-OAEP), closing both the
          determinism and homomorphism gaps at once.
        fact_refs: ["F59:oaep"]
        leads_to: []

  # Candidate chains below are not yet validated; review their node boundaries and prompts before
  # promoting them to the pilot set.

  - id: replay-freshness
    title: Authentication alone does not prevent replay or reordering
    usecase_ref: U2
    threat_ref: T2

    nodes:
      - id: goal
        stage: security_goal
        claim: Beyond integrity of a single message's content, the communication must also reject
          stale, duplicated, or reordered messages - a goal integrity alone doesn't cover, since a
          replayed message has perfectly valid authentication.
        fact_refs: [F52]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: Freshness or sequence information must be authenticated and checked by the verifier.
        fact_refs: [F52]
        leads_to: [mechanism]

      - id: mechanism
        stage: mechanism
        claim: "Whatever authentication mechanism is used (AEAD, F45, or a generic composition,
          F46) must have the freshness/sequence value included in what it authenticates - neither
          F45 nor F46 describe this specifically; F52 is the fact that requires it. (This chain's
          mechanism content is thin: no current fact spells out a concrete freshness mechanism,
          e.g. sequence numbers as AEAD associated data - a real gap, not just a citation gap.)"
        fact_refs: [F52]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: A previously valid ciphertext can be accepted again, or accepted out of order, when
          its freshness or sequence information is absent or not authenticated.
        fact_refs: [F52]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: An active adversary can replay, delete, or reorder messages without forging their
          authenticated content.
        fact_refs: [F52]
        leads_to: []

  - id: random-nonce-collision
    title: Random nonce collisions recreate keystream reuse probabilistically
    usecase_ref: U2
    threat_ref: T1

    nodes:
      - id: goal
        stage: security_goal
        claim: The scheme must provide confidentiality.
        fact_refs: [F2]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: A nonce-generation strategy must make reuse of a key/nonce pair negligibly likely.
        fact_refs: [F24]
        leads_to: [mechanism]

      - id: mechanism
        stage: mechanism
        claim: Generate each nonce independently and uniformly at random from a sufficiently large
          space instead of using a persistent counter.
        fact_refs: [F64, F70]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: A random nonce collision produces the same key/nonce pair for two messages, despite
          there being no counter reset or explicit reuse operation.
        fact_refs: [F24, F70]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: The colliding messages reuse a keystream, so XORing their ciphertexts reveals the XOR
          of their plaintexts and may enable plaintext recovery.
        fact_refs: [F26, F27]
        leads_to: []

  - id: public-key-binding
    title: Unauthenticated public keys enable man-in-the-middle attacks
    usecase_ref: U1
    threat_ref: T2

    nodes:
      - id: goal
        stage: security_goal
        claim: First-contact encryption must keep the intended parties confidential from an active
          intermediary.
        fact_refs: [F2, F8]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: "The public key must be authentically bound to its owner before it is trusted. (No
          `mechanism` node here: this chain has no real mechanism content to cite - F13 itself is a
          deliberate stub deferring the actual binding mechanism, certificates/PKI, to a future
          file. This chain names the requirement and its failure mode, not how binding is achieved.)"
        fact_refs: [F13]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: An active adversary substitutes a public key while the recipient believes it belongs
          to the intended party.
        fact_refs: [F13]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: The adversary can decrypt and re-encrypt traffic while both endpoints believe their
          public-key encryption is protecting the channel.
        fact_refs: [F13]
        leads_to: []

  - id: stream-pseudorandomness
    title: A unique keystream can still be distinguishable from random
    usecase_ref: U2
    threat_ref: T1

    nodes:
      - id: goal
        stage: security_goal
        claim: The stream cipher must provide computational confidentiality, not merely avoid exact
          keystream repetition.
        fact_refs: [F2, F25]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: The keystream must be computationally indistinguishable from a truly random sequence.
        fact_refs: [F25]
        leads_to: [mechanism]

      - id: mechanism
        stage: mechanism
        claim: Expand a short secret key with a secure PRNG/CSPRNG rather than using a visibly
          biased generator.
        fact_refs: [F34]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: A generator can avoid nonce reuse while still producing statistically detectable
          keystream biases, as in RC4's early output.
        fact_refs: [F25, F63]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: An observer can distinguish the keystream from random and exploit the bias without
          first recovering the key or relying on nonce reuse.
        fact_refs: [F25, F63]
        leads_to: []

  - id: block-cipher-iteration
    title: Iterated rounds make a compact block-cipher description behave randomly
    usecase_ref: U3
    threat_ref: T1

    nodes:
      - id: goal
        stage: security_goal
        claim: A block cipher (a keyed permutation on fixed-size blocks, F14) that's compactly
          keyed should still hide exploitable structure from an observer who lacks the key.
        fact_refs: [F14, F17, F18]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: The construction must accumulate enough non-linearity, confusion, and diffusion to
          make the composed permutation resemble a random permutation.
        fact_refs: [F18, F19, F20]
        leads_to: [mechanism]

      - id: mechanism
        stage: mechanism
        claim: "Iterate keyed round functions under a key schedule across many rounds (concretely:
          AES, F58, uses 10/12/14 such rounds depending on key size)."
        fact_refs: [F19, F58]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: Too few rounds or insufficient non-linearity leaves statistical structure intact.
        fact_refs: [F21]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: Differential or linear cryptanalysis can exploit the remaining structure.
        fact_refs: [F21]
        leads_to: []

  - id: otp-tradeoff
    title: One-time pad perfection trades computation for key distribution
    usecase_ref: U2
    threat_ref: T1

    nodes:
      - id: goal
        stage: security_goal
        claim: The system should provide confidentiality even against an adversary with unlimited
          computational power.
        fact_refs: [F29]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: The keystream must be truly random, at least as long as the message, and used only
          once.
        fact_refs: [F28, F32, F33]
        leads_to: [mechanism]

      - id: mechanism
        stage: mechanism
        claim: Use a one-time pad rather than expanding a short key into a computationally secure
          keystream.
        fact_refs: [F28, F34]
        leads_to: [implementation_requirement, residual_limitations]

      - id: implementation_requirement
        stage: implementation_requirement
        claim: Distribute and protect a truly random key as long as every message and never reuse it.
        fact_refs: [F32, F33]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: Reusing the one-time-pad key collapses the construction into the two-time-pad
          keystream-reuse failure.
        fact_refs: [F32]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: The attacker obtains the XOR of the plaintexts and may recover both when their
          structure is sufficiently constrained.
        fact_refs: [F26, F27]
        leads_to: []

      - id: residual_limitations
        stage: failure
        claim: Even used perfectly (never reused), OTP's guarantee has real limits, not misuse
          bugs - perfect secrecy covers plaintext content at a fixed, known length, so ciphertext
          length still reveals message length (F30); and OTP is unauthenticated and malleable like
          any unauthenticated XOR-based construction, so flipping a ciphertext bit predictably
          flips the decrypted plaintext bit even without ever recovering the key - the general
          Malleability property behind F31's specific case (F42).
        fact_refs: [F30, F31, F42]
        leads_to: []

  - id: hybrid-encryption
    title: Resolving the bootstrap problem without paying full asymmetric cost on every byte
    usecase_ref: U1   # first contact, no pre-shared key - this chain's whole premise
    threat_ref: T1    # passive eavesdropper; no active adversary needed for the base rationale

    nodes:
      - id: goal
        stage: security_goal
        claim: The scheme must provide confidentiality without requiring a pre-shared secret.
        fact_refs: [F2]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: Symmetric encryption alone is circular here - sharing a key securely already
          requires a secure channel, which is exactly what's missing in a first-contact scenario.
        fact_refs: [F7]
        leads_to: [mechanism_symmetric, mechanism_asymmetric, mechanism_hybrid]

      - id: mechanism_symmetric
        stage: mechanism
        claim: "Attempt: use symmetric encryption alone."
        fact_refs: [F6]
        leads_to: [failure_symmetric]

      - id: failure_symmetric
        stage: failure
        claim: Symmetric encryption alone cannot resolve first contact at all - it requires
          exactly the shared key that's missing, restating the requirement's circularity rather
          than escaping it. Not a security break - a non-starter.
        fact_refs: [F7]
        leads_to: []

      - id: mechanism_asymmetric
        stage: mechanism
        claim: "Attempt: use public-key encryption for everything, not just a session key."
        fact_refs: [F8, F9]
        leads_to: [failure_cost]

      - id: failure_cost
        stage: failure
        claim: "Public-key operations are computationally far more expensive than symmetric ones
          and typically bounded in message size, measurably so - orders-of-magnitude lower
          throughput and disproportionate ciphertext expansion for anything beyond a short
          message, plus far larger keys for equivalent security (both driven by the same
          underlying need as symmetric keys - enough of a keyspace to resist brute-force, F5 - just
          met through much larger numbers in the asymmetric case). Not a security break either -
          impractical, not insecure."
        fact_refs: [F5, F11, F71, F72, F73]
        leads_to: []

      - id: mechanism_hybrid
        stage: mechanism
        claim: "Use public-key encryption once, to transport a symmetric session key (e.g. via
          RSA-OAEP or ElGamal, F60), then symmetric encryption (e.g. AES or ChaCha20, F61) for the
          actual data, with Dec always recovering exactly what Enc produced (F1) - combining
          public-key's no-pre-shared-secret benefit with symmetric's speed. The accepted
          resolution, not a failure branch."
        fact_refs: [F1, F12, F60, F61]
        leads_to: [implementation_requirement]

      - id: implementation_requirement
        stage: implementation_requirement
        claim: The public key used to transport the session key must itself be authentically
          bound to its owner, or an active adversary can substitute it - already covered in full
          by the public-key-binding chain; cited here as a real dependency, not re-derived.
        fact_refs: [F13]
        leads_to: []

  - id: cbc-predictable-iv
    title: A predictable CBC IV lets an adversary distinguish chosen plaintexts
    usecase_ref: U2   # repeated communication under a shared key
    threat_ref: T1    # closest fit; see attack node's caveat - this actually needs a
                       # chosen-plaintext-style capability the T1/T2 catalog doesn't cleanly cover

    nodes:
      - id: goal
        stage: security_goal
        claim: The scheme must provide confidentiality.
        fact_refs: [F2]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: Unlike a nonce, which only needs uniqueness, CBC's IV must additionally be
          unpredictable to an adversary.
        fact_refs: [F36]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: Using a predictable IV in CBC violates this - the mode's own requirement, not a
          weakness of the underlying block cipher.
        fact_refs: [F37]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: "An adversary who can obtain the encryption of chosen plaintexts and observe the
          resulting ciphertexts can distinguish which of two candidate plaintexts produced a given
          ciphertext block, exploiting the predictable IV alone. (This needs a
          chosen-plaintext-style capability beyond pure passive observation - a threat this file's
          two-profile catalog, T1/T2, doesn't cleanly capture; flagged as a catalog gap, not
          modeled precisely by either threat_ref.)"
        fact_refs: [F37]
        leads_to: []

  - id: timing-side-channel
    title: A functionally-correct MAC comparison can still leak the tag through timing
    usecase_ref: U2   # repeated communication under a shared key, ongoing verification
    threat_ref: T2    # exploiting the oracle needs many active, crafted verification attempts

    nodes:
      - id: goal
        stage: security_goal
        claim: The scheme must provide integrity - and specifically, tag verification must not
          leak information about the correct tag through anything observable.
        fact_refs: [F41]
        leads_to: [requirement]

      - id: requirement
        stage: requirement
        claim: A verifier's observable behavior may depend on whether authentication succeeded or
          failed overall, but not on why - not on any internal step evaluated before the
          authentication decision is final.
        fact_refs: [F49]
        leads_to: [implementation_requirement]

      - id: implementation_requirement
        stage: implementation_requirement
        claim: Verifying a MAC/tag must use a constant-time comparison, not an early-exit
          byte-by-byte one.
        fact_refs: [F69]
        leads_to: [failure]

      - id: failure
        stage: failure
        claim: An early-exit comparison leaks how many leading bytes matched via timing, even
          though the function is otherwise completely correct - functional correctness and
          side-channel safety are different properties.
        fact_refs: [F69]
        leads_to: [attack]

      - id: attack
        stage: attack
        claim: Given an actually exposed, measurable timing channel and enough attempts, an
          adversary can forge a valid tag one byte at a time, without knowing the key - though
          this requires a genuine observable timing oracle and favorable conditions, not just
          non-constant-time code in the abstract.
        fact_refs: [F69]
        leads_to: []
