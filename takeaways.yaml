# takeaways.yaml — capability-tagged claims, cited to facts and/or chain nodes
#
# STATUS: 20 takeaways validated across all 10 chains.yaml chains, all `status: candidate`
# markers cleared. Capability coverage so far: ATTACK x4, JUSTIFY x3, DISTINGUISH x3, PREDICT x2,
# DEBUG x2, DESIGN x2, CHOOSE x2, APPLY x1, EXPLAIN x1 - RECALL, TRACE, and IMPLEMENT still have
# zero takeaways, noted as an open gap (chain-construction-process.md's final section) rather
# than filled artificially; no current chain naturally calls for them yet.
# Decision background: fact-granularity-dilemma.md.
#
# Schema:
#   id                  - stable id
#   capability          - one of TODO/03_pedagogical_engine.md's vocabulary: RECALL, EXPLAIN,
#                          DISTINGUISH, TRACE, PREDICT, CHOOSE, APPLY, IMPLEMENT, DEBUG, ATTACK,
#                          DESIGN, JUSTIFY
#   claim               - what the student should be able to do (not a fact restated)
#   chain_node_refs      - "<chain id>:<node id>", inherits that node's fact_refs
#   fact_refs           - direct fact citations not naturally owned by one chain node
#   importance          - core / recommended / optional, same scale as facts-ciphers.md
#   prompt_sketch       - one concrete question this could generate, to sanity-check the takeaway
#                          is actually exercise-shaped and not just a restated fact

takeaways:
  - id: T1-justify-uniqueness
    capability: JUSTIFY
    claim: Explain why a stream cipher's keystream must never repeat under the same key, tracing
      the requirement back to the confidentiality goal it protects.
    chain_node_refs: [nonce-reuse:goal, nonce-reuse:requirement]
    fact_refs: []
    importance: core
    prompt_sketch: >
      A colleague says "reusing a nonce is bad practice, but it's not really a security problem
      unless the attacker also has the key." Are they right? Justify your answer.

  - id: T2-predict-xor-leak
    capability: PREDICT
    claim: Given two ciphertexts known to be produced under a reused keystream, predict what
      XORing them together reveals, without performing any recovery attempt.
    chain_node_refs: [nonce-reuse:attack]
    fact_refs: []
    importance: core
    prompt_sketch: >
      Two messages were encrypted with the same stream-cipher key and nonce. Before writing any
      code, predict what `ct1 XOR ct2` equals in terms of the plaintexts. Then verify in a notebook.

  - id: T3-attack-recover-plaintexts
    capability: ATTACK
    claim: Given two ciphertexts produced under a reused keystream (and enough structure in the
      underlying plaintexts, e.g. natural-language text), recover both plaintexts.
    chain_node_refs: [nonce-reuse:attack]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      You're given two ciphertexts encrypted under the same key/nonce pair with a stream cipher.
      Recover as much of both plaintexts as you can. (Hands-on notebook task - crib-dragging.)

  - id: T4-debug-restart-bug
    capability: DEBUG
    claim: Given a service that resets its nonce counter to zero on every process restart, identify
      why this is a real vulnerability (not a hypothetical one) and propose a fix.
    chain_node_refs: [nonce-reuse:impl_requirement, nonce-reuse:failure_restart]
    fact_refs: []
    importance: core
    prompt_sketch: >
      Here's a code snippet that encrypts log entries with AES-CTR, using an in-memory counter
      starting at 0. The service is deployed as a container that restarts on crash. Find the bug;
      fix it without breaking the existing message format.

  - id: T5-design-multi-instance
    capability: DESIGN
    claim: Choose and justify a nonce-generation strategy for a horizontally-scaled service where
      multiple instances share one key, explaining why the single-instance-safe strategy from
      T4 is not sufficient here.
    chain_node_refs: [nonce-reuse:impl_requirement, nonce-reuse:failure_multi_instance]
    fact_refs: []   # F67 already supplied via chain_node_refs -> failure_multi_instance; no direct citation needed
    importance: recommended
    prompt_sketch: >
      Your team wants to fix T4's bug by persisting the counter to disk. Someone points out the
      service now runs as 5 replicas behind a load balancer, each with its own disk. Does the fix
      still work? Design a strategy that does, and justify the tradeoff you chose.

  - id: T6-distinguish-ecb-is-a-mode
    capability: DISTINGUISH
    claim: Explain why ECB counts as a mode of operation at all, rather than "no mode" or "not
      really encryption," while still identifying exactly why it fails.
    chain_node_refs: [ecb-pattern-leakage:requirement, ecb-pattern-leakage:mechanism]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      A student says "ECB isn't really a mode of operation, it's what you get when you don't use
      one." Is this accurate? Answer precisely, using the actual definition of a mode.

  - id: T7-predict-ecb-image
    capability: PREDICT
    claim: Given a bitmap image with large uniform-color regions, predict what its ECB-encrypted
      form will visually look like, before running it.
    chain_node_refs: [ecb-pattern-leakage:failure, ecb-pattern-leakage:attack]
    fact_refs: []
    importance: core
    prompt_sketch: >
      Before running any code: you're given a BMP image with a large solid-color background. Its
      pixel data (header already stripped, so you're encrypting raw pixel bytes only) happens to be
      an exact multiple of 16 bytes, so no padding is needed. Sketch what you expect the
      AES-ECB-encrypted pixel data to look like when rendered back as an image, and why. Then
      verify in a notebook.

  - id: T8-debug-ecb-choice
    capability: DEBUG
    claim: Given a code review showing a block cipher used directly (one call per block, no IV/
      nonce parameter) to encrypt records at rest, identify the problem and apply the minimal fix
      that restores confidentiality - integrity is explicitly out of scope for this task.
    chain_node_refs: [ecb-pattern-leakage:mechanism, ecb-pattern-leakage:attack]
    fact_refs: []
    importance: core
    prompt_sketch: >
      Review this function: it AES-encrypts a record by splitting it into 16-byte blocks and
      calling the raw block-cipher primitive on each one independently. What's wrong, concretely?
      Fix it so it provides confidentiality (a proper mode with an IV/nonce, e.g. CBC or CTR) -
      you don't need to add a MAC or authentication for this task, just fix the confidentiality
      problem you found.

  - id: T9-choose-composition-ordering
    capability: CHOOSE
    claim: Given the three generic-composition orderings, choose Encrypt-then-MAC and explain what
      specific risk each of the other two introduces - not that they're strictly broken, but that
      neither is generically robust the way Encrypt-then-MAC is under the same minimal assumptions.
    chain_node_refs: [composition-integrity:impl_requirement, composition-integrity:safe_etm]
    fact_refs: []
    importance: core
    prompt_sketch: >
      You need to add integrity to an existing encrypted channel by hand (no AEAD library
      available). Three colleagues propose Encrypt-then-MAC, MAC-then-encrypt, and
      Encrypt-and-MAC respectively. Which do you implement? For each of the other two, name the
      specific risk it introduces (not just "it's less common") and the condition under which that
      risk would actually bite.

  - id: T10-attack-padding-oracle
    capability: ATTACK
    claim: Given a service using MAC-then-encrypt over CBC that reveals whether padding was valid
      (distinct error messages or timing), recover a plaintext byte at a time without the key.
    chain_node_refs: [composition-integrity:failure_padding_oracle, composition-integrity:attack_padding_oracle]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      You have oracle access to a decryption endpoint that returns HTTP 400 for "bad padding" and
      HTTP 401 for "bad MAC." Given one intercepted ciphertext, recover the plaintext. (Hands-on
      notebook task.)

  - id: T11-attack-tag-equality
    capability: ATTACK
    claim: Given an Encrypt-and-MAC scheme using a deterministic MAC, determine whether two
      intercepted messages are identical without decrypting either.
    chain_node_refs: [composition-integrity:failure_tag_leak, composition-integrity:attack_tag_leak]
    fact_refs: []
    importance: optional
    prompt_sketch: >
      Two ciphertexts were sent under Encrypt-and-MAC with a deterministic MAC (same key both
      times). Without decrypting anything, determine whether the underlying plaintexts were the
      same message. Explain why this works even though the MAC itself was never forged.

  - id: T12-justify-rsa-determinism-gap
    capability: JUSTIFY
    claim: Explain why textbook RSA satisfying "hard to invert without the key" (the bare
      confidentiality floor) does not make it secure in practice.
    chain_node_refs: [rsa-determinism:requirement, rsa-determinism:mechanism_textbook]
    fact_refs: []
    importance: core
    prompt_sketch: >
      "RSA is secure because factoring is hard, and you can't invert RSA encryption without
      factoring the modulus." A colleague uses this reasoning to justify encrypting each field of
      a database directly with raw RSA. What's wrong with the reasoning, concretely?

  - id: T13-distinguish-rsa-attacks
    capability: DISTINGUISH
    claim: Distinguish the equality-testing attack (from determinism) and the ciphertext-
      transformation attack (from multiplicative homomorphism) as two separate consequences of two
      separate properties, neither implying the other.
    chain_node_refs: [rsa-determinism:attack_equality, rsa-determinism:attack_malleability]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      Two students each find a different attack against raw RSA: one tests whether two ciphertexts
      encrypt the same plaintext, the other transforms a valid ciphertext into a new valid
      ciphertext for a related plaintext. Are these the same underlying bug? Explain.

  - id: T14-apply-oaep-fix
    capability: APPLY
    claim: Given a raw-RSA misuse scenario, identify which specific attack applies and confirm
      that switching to RSA-OAEP closes it.
    chain_node_refs: [rsa-determinism:mechanism_oaep]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      A voting system encrypts each ballot ("yes" or "no") directly with a voter's raw RSA public
      key. Show how an observer breaks ballot secrecy without any key material, then show that
      switching to RSA-OAEP prevents the specific attack you found.

  # Candidate takeaways below correspond to candidate chains in chains.yaml. They are not yet
  # validated; review their prompts and capability alignment before promotion.

  - id: T15-justify-replay-protection
    capability: JUSTIFY
    claim: Explain why authenticated encryption alone does not necessarily prevent replay,
      deletion, or reordering.
    chain_node_refs: [replay-freshness:goal, replay-freshness:requirement]
    fact_refs: []
    importance: core
    prompt_sketch: >
      An engineer says, "Every message has a valid AEAD tag, so an attacker cannot replay an old
      payment request." Is the argument sufficient? Identify the missing protection and explain
      what the verifier must check.

  - id: T16-design-random-nonces
    capability: DESIGN
    claim: Design a random-nonce strategy whose collision probability remains negligible under a
      stated message volume and shared-key lifetime.
    chain_node_refs: [random-nonce-collision:mechanism, random-nonce-collision:failure]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      A service will encrypt 10^9 messages under one key and cannot persist a counter. Choose a
      nonce-generation strategy, estimate the collision risk, and explain what would happen if a
      collision occurred.

  - id: T17-attack-public-key-substitution
    capability: ATTACK
    claim: Show how an active intermediary defeats confidentiality when a public key is not
      authenticated.
    chain_node_refs: [public-key-binding:requirement, public-key-binding:failure,
      public-key-binding:attack]
    fact_refs: []
    importance: core
    prompt_sketch: >
      Alice downloads Bob's public key over an unauthenticated channel and encrypts a session key
      with it. Construct the intermediary's substitution attack and identify what authenticated
      binding must prevent it.

  - id: T18-distinguish-keystream-failures
    capability: DISTINGUISH
    claim: Distinguish nonce/key reuse from a keystream generator that is distinguishable from
      random even when nonces are unique.
    chain_node_refs: [stream-pseudorandomness:requirement, stream-pseudorandomness:failure]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      Two stream-cipher implementations never reuse a nonce. One leaks plaintext relations after
      reuse; the other exhibits biased early keystream bytes. Identify which security requirement
      each violates and why the fixes differ.

  - id: T19-explain-block-rounds
    capability: EXPLAIN
    claim: Explain how iterated keyed rounds reconcile a compact key with a permutation that hides
      exploitable structure.
    chain_node_refs: [block-cipher-iteration:requirement, block-cipher-iteration:mechanism,
      block-cipher-iteration:failure]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      A colleague proposes a block cipher with a 128-bit key but only a single round, arguing "the
      key is already unguessable, why do we need more than one round?" Explain what a single round
      fails to provide that a random permutation would, and why iterating the round function (not
      lengthening the key) is what actually closes that gap.

  - id: T20-choose-otp-or-stream-cipher
    capability: CHOOSE
    claim: Choose between a one-time pad and a practical stream cipher by weighing information-
      theoretic secrecy against key distribution and operational cost.
    chain_node_refs: [otp-tradeoff:goal, otp-tradeoff:requirement, otp-tradeoff:mechanism]
    fact_refs: []
    importance: recommended
    prompt_sketch: >
      You must protect a 1 GB message against an adversary with unlimited computation, but the
      sender and receiver can pre-share only 256 bits. Is a one-time pad feasible? If not, identify
      exactly which requirement forces the design choice and what security tradeoff results.
